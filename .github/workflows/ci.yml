name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Playwright installs its browser's system packages on releases it knows; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run bench
      - run: bun run --cwd packages/playground build
      - run: bun run --cwd packages/pixel install-browser
      - run: bun run test:pixel
