      <rect x="-15" y="-15" width="30" height="30" fill="none" stroke="#c00" stroke-width="2"/>
      <g transform="scale(1.5 0.7) skewX(20)">
        <circle r="12" fill="#06c" fill-opacity="0.5"/>
