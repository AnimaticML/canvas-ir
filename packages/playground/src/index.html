<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CanvasIR Playground</title>
    <style>
      :root {
        --bg: #f6f6f4;
        --panel: #ffffff;
        --text: #1d1d1b;
        --muted: #6b6b66;
        --border: #dcdcd6;
        --accent: #2563eb;
        --hover: #f59e0b;
        --board: #ffffff;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #171716;
          --panel: #20201f;
          --text: #ececea;
          --muted: #9b9b95;
          --border: #34342f;
          --accent: #60a5fa;
          --hover: #fbbf24;
          --board: #fafaf8;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #171716;
        --panel: #20201f;
        --text: #ececea;
        --muted: #9b9b95;
        --border: #34342f;
        --accent: #60a5fa;
        --hover: #fbbf24;
        --board: #fafaf8;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      /* The page is one board, and all of it is canvas: the drawing, the cards of controls over it, and the overlay of marks. */
      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--board);
        touch-action: none;
      }
      #stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #stage #cards,
      #stage #overlay {
        pointer-events: none;
      }
      .canvas-ir-a11y :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="board"></canvas><canvas id="cards"></canvas><canvas id="overlay"></canvas></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
