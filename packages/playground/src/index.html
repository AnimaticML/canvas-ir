<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CanvasIR Playground</title>
    <style>
      :root {
        --bg: #f6f6f4;
        --panel: #ffffff;
        --text: #1d1d1b;
        --muted: #6b6b66;
        --border: #dcdcd6;
        --accent: #2563eb;
        --hover: #f59e0b;
        --board: #ffffff;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #171716;
          --panel: #20201f;
          --text: #ececea;
          --muted: #9b9b95;
          --border: #34342f;
          --accent: #60a5fa;
          --hover: #fbbf24;
          --board: #fafaf8;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #171716;
        --panel: #20201f;
        --text: #ececea;
        --muted: #9b9b95;
        --border: #34342f;
        --accent: #60a5fa;
        --hover: #fbbf24;
        --board: #fafaf8;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      /* Everything you see is canvas: the toolbar, the board and the side panel. */
      #toolbar {
        display: block;
        width: 100%;
        height: 52px;
        flex: none;
      }
      main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
      }
      @media (max-width: 760px) {
        main {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) 45%;
        }
      }
      #stage {
        position: relative;
        overflow: hidden;
        background: var(--board);
        touch-action: none;
        min-height: 0;
      }
      #stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #stage #overlay {
        pointer-events: none;
      }
      #side {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
        border-left: 1px solid var(--border);
        touch-action: none;
      }
      .canvas-ir-a11y :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <canvas id="toolbar"></canvas>
    <main>
      <div id="stage"><canvas id="board"></canvas><canvas id="overlay"></canvas></div>
      <canvas id="side"></canvas>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
