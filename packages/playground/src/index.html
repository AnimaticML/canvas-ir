<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CanvasIR Playground</title>
    <style>
      :root {
        --bg: #f6f6f4;
        --panel: #ffffff;
        --text: #1d1d1b;
        --muted: #6b6b66;
        --border: #dcdcd6;
        --accent: #2563eb;
        --hover: #f59e0b;
        --board: #ffffff;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #171716;
          --panel: #20201f;
          --text: #ececea;
          --muted: #9b9b95;
          --border: #34342f;
          --accent: #60a5fa;
          --hover: #fbbf24;
          --board: #fafaf8;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #171716;
        --panel: #20201f;
        --text: #ececea;
        --muted: #9b9b95;
        --border: #34342f;
        --accent: #60a5fa;
        --hover: #fbbf24;
        --board: #fafaf8;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      header h1 {
        font-size: 15px;
        margin: 0 12px 0 0;
      }
      button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      .spacer {
        flex: 1;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 16px;
        padding: 16px;
      }
      @media (max-width: 760px) {
        main {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      #stage {
        position: relative;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: var(--board);
        height: min(70vh, 640px);
        touch-action: none;
      }
      #stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      aside {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
      }
      section h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      textarea {
        width: 100%;
        min-height: 90px;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        background: transparent;
        color: inherit;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #log {
        max-height: 160px;
        overflow: auto;
        color: var(--muted);
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>CanvasIR Playground</h1>
      <span id="samples"></span>
      <span class="spacer"></span>
      <button id="export-svg">Export SVG</button>
      <button id="export-json">Export JSON</button>
      <button id="reset-view">Reset view</button>
    </header>
    <main>
      <div id="stage"><canvas id="board"></canvas></div>
      <aside>
        <section>
          <h2>Selection</h2>
          <pre id="selection">Click something on the board.</pre>
          <p class="hint">Drag moves an object, or one shape with Alt held. Delete removes the selection. Scroll zooms; drag empty space to pan.</p>
        </section>
        <section>
          <h2>Add an SVG</h2>
          <textarea id="svg-input" spellcheck="false" placeholder="Paste SVG markup"></textarea>
          <button id="add-svg">Draw it through canvg</button>
        </section>
        <section>
          <h2>Events</h2>
          <pre id="log"></pre>
        </section>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
