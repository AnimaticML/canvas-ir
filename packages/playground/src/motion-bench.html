<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Motion bench</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #e2e8f0; color: #0f172a; font: 13px/1.4 system-ui, sans-serif; }
      header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 12px; background: #fff; border-bottom: 1px solid #cbd5e1; }
      header h1 { font-size: 15px; margin: 0 6px 0 0; }
      header label { display: flex; align-items: center; gap: 6px; }
      select { font: inherit; padding: 3px 6px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; }
      button { font: 600 13px/1 system-ui, sans-serif; border: 0; border-radius: 999px; padding: 8px 14px; background: #0f172a; color: #fff; cursor: pointer; }
      button.light { background: #e2e8f0; color: #0f172a; }
      button:disabled { opacity: 0.4; cursor: default; }
      header a { margin-left: auto; color: #334155; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 0; }
      .stage { position: relative; background: #0f172a; display: grid; place-items: center; min-height: 60vh; }
      #render { max-width: 100%; max-height: 80vh; display: block; }
      .frame { position: relative; }
      #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      aside { background: #fff; border-left: 1px solid #cbd5e1; padding: 10px 12px; font-size: 12px; overflow: auto; max-height: calc(100vh - 50px); }
      aside h2 { font-size: 13px; margin: 12px 0 4px; }
      aside h2:first-child { margin-top: 0; }
      aside p { margin: 4px 0; color: #475569; }
      table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
      td, th { padding: 1px 4px; text-align: right; }
      td:first-child, th:first-child { text-align: left; }
      th { color: #64748b; font-weight: 500; }
      .bad { color: #dc2626; } .ok { color: #d97706; } .good { color: #059669; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { border-left: 0; max-height: none; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Motion bench</h1>
      <label>Model <input id="model" type="file" accept=".glb" /></label>
      <label>Movement <select id="script"></select></label>
      <label>Camera <select id="setup"></select></label>
      <button id="run" disabled>Run</button>
      <button id="all" class="light" disabled>Run all</button>
      <button id="save" class="light" disabled>Save take</button>
      <a href="./motion.html">motion lab</a>
    </header>
    <main>
      <div class="stage"><div class="frame"><canvas id="render" width="640" height="480"></canvas><canvas id="overlay" width="640" height="480"></canvas></div></div>
      <aside id="info"></aside>
    </main>
    <script type="module" src="./motion-bench.ts"></script>
  </body>
</html>
